# Schema version (must match parent version directory)
version: 1

nodes:
  Target:
    description: "Network endpoint, service, application, or host being assessed. Can represent hosts, services, web applications, or authentication endpoints. Examples: 'Apache 2.4.29 on 172.22.0.7:80', 'SSH service on 10.10.11.100:22', 'Backdrop CMS login at /user/login'"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      identifier:
        type: string
        description: "Primary identifier (hostname, IP, URL, endpoint)"
      target_type:
        type: string
        enum: [host, service, web_application, api_endpoint, auth_endpoint, database, network_range]
        description: "Type of target"
      hostname:
        type: string
        description: "DNS hostname if applicable"
      ip_address:
        type: string
        description: "IP address if applicable"
        regex: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$"
      port:
        type: int
        description: "Port number if service-specific"
        min: 1
        max: 65535
      protocol:
        type: string
        description: "Protocol (HTTP, SSH, FTP, MySQL, etc.)"
      technology_stack:
        type: string[]
        description: "Technologies detected (PHP, Apache, MySQL, etc.)"
      status:
        type: string
        enum: [discovered, active, compromised, analyzed, unreachable]
        description: "Current assessment status"

  Vulnerability:
    description: "Security weakness with CVE identifier, vulnerability class, or technical description. Examples: 'CVE-2016-10134 SQLi in jsrpc.php', 'XXE injection in document parser', 'Default credentials on admin panel'"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      name:
        type: string
        description: "Vulnerability name or title"
      vulnerability_class:
        type: string
        enum: [sql_injection, rce, xss, xxe, ssrf, lfi, rfi, csrf, auth_bypass, file_upload, command_injection, directory_traversal, privilege_escalation, information_disclosure, weak_credentials, misconfiguration, other]
        description: "OWASP/CWE category"
      cve_id:
        type: string
        description: "CVE identifier if applicable"
      severity:
        type: string
        enum: [critical, high, medium, low, info]
        description: "Severity assessment"
      exploitability:
        type: string
        enum: [confirmed, likely, theoretical, not_exploitable, unknown]
        description: "Whether vulnerability can be exploited"
      description:
        type: string
        description: "Technical description"

  Tool:
    description: "Security tool or exploitation framework used during testing. Examples: 'nmap', 'sqlmap', 'hydra', 'metasploit'"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      name:
        type: string
        description: "Tool name"
      category:
        type: string
        enum: [scanner, exploitation, fuzzer, reconnaissance, enumeration, password_cracker, web_proxy, network_tool, custom_script]
        description: "Category of tool"

  TechnicalFinding:
    description: "Any security observation, test result, or extracted data. Use for database schemas, file contents, session tokens, exploitation results, etc. Examples: '113 DB tables enumerated', '/etc/passwd: 48 users', 'PHPSESSID cookie obtained', 'SSH key found at /root/.ssh/id_rsa'"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      finding_type:
        type: string
        enum: [version_disclosure, open_port, configuration, credential_found, sensitive_data, exploit_result, file_access, session_token, database_schema, command_output, authentication_result, other]
        description: "Type of finding"
      title:
        type: string
        description: "Brief title"
      content:
        type: string
        description: "Detailed content (sanitized)"
      severity:
        type: string
        enum: [critical, high, medium, low, info]
        description: "Severity"
      success:
        type: boolean
        description: "Whether the action succeeded (for exploit/auth results)"

  AttackTechnique:
    description: "Exploitation method or attack pattern. Examples: 'Error-based SQLi via updatexml()', 'SSH brute force with hydra', 'XXE file exfiltration'"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      name:
        type: string
        description: "Technique name"
      category:
        type: string
        enum: [initial_access, execution, persistence, privilege_escalation, credential_access, discovery, lateral_movement, exfiltration, impact]
        description: "MITRE ATT&CK category"
      payload:
        type: string
        description: "Payload or command used (sanitized)"
      success:
        type: boolean
        description: "Whether technique succeeded"

  Username:
    description: "Discovered username for authentication. CRITICAL: Extract from git authors (name AND email local part), config files, user enumeration, /etc/passwd. Examples: 'johncusack' (git author), 'admin' (enumeration), 'dog' (from dog@dog.htb)"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      value:
        type: string
        description: "The username"
      source_type:
        type: string
        enum: [git_author, git_email, config_file, user_enumeration, file_owner, database, web_page, other]
        description: "Where discovered"
      source_detail:
        type: string
        description: "Specific source (e.g., 'git log', '/etc/passwd')"

  Password:
    description: "Discovered password or secret for authentication. CRITICAL: Extract from config files, database dumps, source code. Examples: 'BackDropJ2024DS2024' (settings.php), 'zabbix' (default)"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      value_hint:
        type: string
        description: "Partial value for identification (e.g., 'Back...16ch')"
      source_type:
        type: string
        enum: [config_file, database, source_code, environment_var, default, brute_force, other]
        description: "Where discovered"
      password_format:
        type: string
        enum: [plaintext, hash, base64, other]
        description: "Format"

  Credential:
    description: "Confirmed username/password pair or auth token. Created when discovered together or tested successfully. Examples: 'Admin/zabbix', 'johncusack/BackDropJ2024DS2024', 'API key: sk-abc...'"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      entity_uuid:
        type: string
        description: "Unique identifier"
      credential_type:
        type: string
        enum: [username_password, api_key, token, ssh_key, cookie, hash]
        description: "Type"
      username:
        type: string
        description: "Username component"
      is_valid:
        type: boolean
        description: "Whether credential works"
      is_default:
        type: boolean
        description: "Whether default credential"
      privilege_level:
        type: string
        enum: [admin, user, guest, root, unknown]
        description: "Access level"
      source:
        type: string
        description: "How obtained"

edges:
  HAS_VULNERABILITY:
    description: "A target has a vulnerability"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When identified"
      verified:
        type: boolean
        description: "Whether verified through exploitation"

  USED_AGAINST:
    description: "A tool, technique, or credential was used against a target"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When used"
      success:
        type: boolean
        description: "Whether successful"
      context:
        type: string
        description: "Execution context (command, parameters)"

  EXPLOITS:
    description: "A technique exploits a vulnerability"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When exploited"
      success:
        type: boolean
        description: "Whether successful"

  YIELDS:
    description: "An action yields a finding, credential, or other result"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When produced"

  LEADS_TO:
    description: "One entity leads to discovery of another (attack chains, pivots)"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When connection established"
      reasoning:
        type: string
        description: "How one leads to the other"

  PROVIDES_ACCESS_TO:
    description: "A credential provides access to a target"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When verified"
      access_level:
        type: string
        enum: [read_only, read_write, admin, root, limited]
        description: "Level of access"

  USES_TOOL:
    description: "A technique uses a specific tool"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When used"

  TESTED_AGAINST:
    description: "A username, password, or credential was tested against a target/service. CRITICAL for tracking credential reuse."
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When tested"
      success:
        type: boolean
        description: "Whether authentication succeeded"
      method:
        type: string
        enum: [manual, hydra, medusa, burp, script, other]
        description: "Testing method"

  PAIRS_WITH:
    description: "A username pairs with a password (for credential testing)"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When identified"
      reason:
        type: string
        enum: [same_source, reuse_hypothesis, default, confirmed_working, other]
        description: "Why paired"
      confirmed:
        type: boolean
        description: "Whether confirmed valid"

  REVEALED:
    description: "A finding revealed credentials, usernames, or passwords"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When revealed"

  DISCOVERED_FROM:
    description: "A username or password was discovered from a source"
    fields:
      version:
        type: int
        description: "Taxonomy schema version"
      timestamp:
        type: timestamp
        description: "When discovered"
      source_file:
        type: string
        description: "File path if applicable"

relationships:
  # Target relationships
  - source: Target
    target: Vulnerability
    edges: [HAS_VULNERABILITY]
  
  - source: Target
    target: Target
    edges: [LEADS_TO]

  # Tool relationships  
  - source: Tool
    target: Target
    edges: [USED_AGAINST]
  
  - source: Tool
    target: TechnicalFinding
    edges: [YIELDS]
  
  - source: Tool
    target: Vulnerability
    edges: [YIELDS]

  # Technique relationships
  - source: AttackTechnique
    target: Target
    edges: [USED_AGAINST]
  
  - source: AttackTechnique
    target: Vulnerability
    edges: [EXPLOITS]
  
  - source: AttackTechnique
    target: Tool
    edges: [USES_TOOL]
  
  - source: AttackTechnique
    target: TechnicalFinding
    edges: [YIELDS]
  
  - source: AttackTechnique
    target: AttackTechnique
    edges: [LEADS_TO]

  # Finding relationships
  - source: TechnicalFinding
    target: Vulnerability
    edges: [LEADS_TO]
  
  - source: TechnicalFinding
    target: TechnicalFinding
    edges: [LEADS_TO]
  
  - source: TechnicalFinding
    target: Credential
    edges: [REVEALED]
  
  - source: TechnicalFinding
    target: Username
    edges: [REVEALED]
  
  - source: TechnicalFinding
    target: Password
    edges: [REVEALED]

  # Credential relationships
  - source: Credential
    target: Target
    edges: [PROVIDES_ACCESS_TO, TESTED_AGAINST]

  # Username relationships (CRITICAL for credential reuse)
  - source: Username
    target: Target
    edges: [TESTED_AGAINST, DISCOVERED_FROM]
  
  - source: Username
    target: Password
    edges: [PAIRS_WITH]

  # Password relationships (CRITICAL for credential reuse)
  - source: Password
    target: Target
    edges: [TESTED_AGAINST, DISCOVERED_FROM]
